<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG Image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    background: #08090d;
  }
  .og {
    width: 1200px;
    height: 630px;
    position: relative;
    background:
      radial-gradient(700px 500px at 10% -10%, rgba(124,92,255,.30), transparent 70%),
      radial-gradient(800px 600px at 95% 10%, rgba(34,211,238,.20), transparent 70%),
      radial-gradient(600px 500px at 50% 120%, rgba(255,77,157,.15), transparent 70%),
      #08090d;
    display: flex;
    flex-direction: column;
    padding: 60px 70px;
    overflow: hidden;
  }
  /* Grid lines background */
  .og::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  /* Top: Logo bar */
  .top {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    z-index: 2;
  }
  .logo-mark {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, #7c5cff, #22d3ee);
    display: grid;
    place-items: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: #08090d;
    box-shadow: 0 12px 30px -8px rgba(124,92,255,.7);
  }
  .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: #e9ebf2;
    letter-spacing: -0.02em;
  }
  .brand span {
    background: linear-gradient(110deg, #7c5cff 10%, #22d3ee 55%, #ff4d9d 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* Middle: Main content */
  .middle {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    z-index: 2;
    margin-top: 30px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 15px;
    color: #8b90a4;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    margin-bottom: 28px;
    width: fit-content;
    font-weight: 500;
  }
  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3ddc84;
    box-shadow: 0 0 12px rgba(61,220,132,.8);
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 76px;
    line-height: 1.05;
    letter-spacing: -0.035em;
    font-weight: 700;
    color: #e9ebf2;
    margin-bottom: 24px;
  }
  h1 .grad {
    background: linear-gradient(110deg, #7c5cff 10%, #22d3ee 55%, #ff4d9d 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    font-size: 22px;
    color: #8b90a4;
    line-height: 1.5;
    max-width: 780px;
    font-weight: 400;
  }

  /* Bottom: Stats row */
  .bottom {
    display: flex;
    align-items: center;
    gap: 40px;
    position: relative;
    z-index: 2;
    padding-top: 30px;
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat .v {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 32px;
    color: #e9ebf2;
    letter-spacing: -0.02em;
  }
  .stat .v.green { color: #3ddc84; }
  .stat .v.cyan { color: #22d3ee; }
  .stat .v.violet { color: #7c5cff; }
  .stat .v.pink { color: #ff4d9d; }
  .stat .l {
    font-size: 12px;
    color: #8b90a4;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
  }

  .url {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: #8b90a4;
    background: rgba(255,255,255,.04);
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.08);
  }
</style>
</head>
<body>
  <div class="og">
    <div class="top">
      <div class="logo-mark">HR</div>
      <div class="brand">Hackathon <span>Rivals</span></div>
    </div>

    <div class="middle">
      <div class="pill">
        <span class="live-dot"></span>
        Season 2026 · Registrations Open
      </div>
      <h1>India's national arena<br>for <span class="grad">student innovators.</span></h1>
      <p class="sub">36-hour Grand Finale · 17 themes · 12 ministries · Hosted in New Delhi</p>
    </div>

    <div class="bottom">
      <div class="stat">
        <div class="v violet">12,400+</div>
        <div class="l">Innovators</div>
      </div>
      <div class="stat">
        <div class="v cyan">860+</div>
        <div class="l">Colleges</div>
      </div>
      <div class="stat">
        <div class="v green">ANNOUNCEMENT SOON</div>
        <div class="l">Prize Pool</div>
      </div>
      <div class="url">hackathonrivals.in</div>
    </div>
  </div>
</body>
</html>
